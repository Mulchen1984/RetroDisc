name: RetroDisc Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:

  # ══════════════════════════════
  # WINDOWS: RetroDisc.exe
  # ══════════════════════════════
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies installieren
        run: |
          pip install pyinstaller pywebview pydantic structlog rich click `
            httpx yt-dlp sounddevice soundfile certifi `
            openai-whisper scenedetect librosa pillow

      - name: FFmpeg fuer Windows laden
        run: python prepare_vendor.py

      - name: RetroDisc.exe bauen
        run: |
          python -m PyInstaller `
            --onefile --windowed `
            --name "RetroDisc" `
            --icon "assets/retrodisc.ico" `
            --version-file "version_info.txt" `
            --manifest "retrodisc.manifest" `
            --add-data "src/ui/app.html;src/ui" `
            --add-data "src/ui/splash.html;src/ui" `
            --add-data "assets;assets" `
            --add-data "vendor/ffmpeg.exe;vendor" `
            --add-data "vendor/ffprobe.exe;vendor" `
            --collect-data pydantic --collect-data certifi `
            --collect-data yt_dlp --collect-submodules yt_dlp `
            --hidden-import src.core.ffmpeg `
            --hidden-import src.core.pipeline `
            --hidden-import src.core.downloader `
            --hidden-import src.core.disc `
            --hidden-import src.services.converter `
            --hidden-import src.services.search `
            --hidden-import src.services.library `
            --hidden-import src.services.dvd_workflow `
            --hidden-import src.services.smart_edit `
            --hidden-import src.services.subtitle `
            --hidden-import src.services.upscaler `
            --hidden-import src.services.assistant `
            --hidden-import src.services.watch_folder `
            --hidden-import src.config.settings `
            --hidden-import src.config.presets `
            --hidden-import src.models.media `
            --hidden-import src.utils.sound `
            --hidden-import src.bootstrap `
            --hidden-import webview.platforms.winforms `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import pydantic_core --hidden-import sqlite3 `
            --noconfirm `
            retrodisc_portable.py

      - name: EXE pruefen
        run: |
          $s = (Get-Item "dist/RetroDisc.exe").length / 1MB
          Write-Host "RetroDisc.exe: $([math]::Round($s,1)) MB"
          if ($s -lt 50) { exit 1 }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RetroDisc-Windows
          path: dist/RetroDisc.exe
          retention-days: 90

  # ══════════════════════════════
  # MACOS: RetroDisc.dmg mit echtem .app Bundle
  # ══════════════════════════════
  build-macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies installieren
        run: |
          pip install pyinstaller pywebview pydantic structlog rich click \
            httpx yt-dlp sounddevice soundfile certifi \
            openai-whisper scenedetect librosa pillow

      - name: FFmpeg fuer macOS laden
        run: |
          mkdir -p vendor
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" \
               -o /tmp/ffmpeg.zip --silent --show-error
          cd vendor && unzip -o /tmp/ffmpeg.zip && chmod +x ffmpeg && cd ..
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" \
               -o /tmp/ffprobe.zip --silent --show-error
          cd vendor && unzip -o /tmp/ffprobe.zip && chmod +x ffprobe && cd ..

      - name: ICNS Icon erstellen
        run: |
          python3 - << PYEOF
          from PIL import Image, ImageDraw, ImageFont
          import subprocess, os
          from pathlib import Path

          def make_icon(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              m = size // 10
              # Blauer Hintergrund-Kreis
              draw.ellipse([m, m, size-m, size-m], fill="#1468DC", outline="#0040A0", width=max(1,size//32))
              # Glanz
              draw.ellipse([m*2, m*2, size*2//3, size*2//3], fill=(255,255,255,40))
              # Disc
              cx, cy, r = size//2, size//2+size//16, size*3//8
              draw.ellipse([cx-r,cy-r,cx+r,cy+r], fill="#C8C8D8", outline="#888899", width=max(1,size//32))
              hr = size//10
              draw.ellipse([cx-hr,cy-hr,cx+hr,cy+hr], fill="#666677")
              # Schimmer
              for i,c in enumerate(["#FF6688","#FFAA44","#44CCFF","#88FF88"]):
                  ar = r-size//16-i*size//24
                  if ar > hr+2:
                      draw.arc([cx-ar,cy-ar,cx+ar,cy+ar], 30+i*20, 80+i*20, fill=c, width=max(1,size//32))
              # RD Text
              fs = max(8, size//5)
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", fs)
              except:
                  font = ImageFont.load_default()
              ty = size//6
              draw.text((size//2+1,ty+1), "RD", font=font, fill="#002266", anchor="mt")
              draw.text((size//2,ty), "RD", font=font, fill="white", anchor="mt")
              return img

          iconset = Path("/tmp/retrodisc.iconset")
          iconset.mkdir(exist_ok=True)
          for s in [16,32,64,128,256,512,1024]:
              make_icon(s).save(iconset/f"icon_{s}x{s}.png")
              if s <= 512:
                  make_icon(s*2).save(iconset/f"icon_{s}x{s}@2x.png")
          subprocess.run(["iconutil","-c","icns",str(iconset),"-o","assets/retrodisc.icns"], check=True)
          print("ICNS erstellt:", Path("assets/retrodisc.icns").stat().st_size, "bytes")
          PYEOF

      - name: RetroDisc.app bauen (Bundle, kein onefile)
        run: |
          python3 -m PyInstaller \
            --windowed \
            --name "RetroDisc" \
            --icon "assets/retrodisc.icns" \
            --osx-bundle-identifier "de.retrodisc.app" \
            --add-data "src/ui/app.html:src/ui" \
            --add-data "src/ui/splash.html:src/ui" \
            --add-data "assets:assets" \
            --add-data "vendor/ffmpeg:vendor" \
            --add-data "vendor/ffprobe:vendor" \
            --collect-data pydantic --collect-data certifi \
            --collect-data yt_dlp --collect-submodules yt_dlp \
            --hidden-import src.core.ffmpeg \
            --hidden-import src.core.pipeline \
            --hidden-import src.core.downloader \
            --hidden-import src.core.disc \
            --hidden-import src.services.converter \
            --hidden-import src.services.search \
            --hidden-import src.services.library \
            --hidden-import src.services.dvd_workflow \
            --hidden-import src.services.smart_edit \
            --hidden-import src.services.subtitle \
            --hidden-import src.services.upscaler \
            --hidden-import src.services.assistant \
            --hidden-import src.services.watch_folder \
            --hidden-import src.config.settings \
            --hidden-import src.config.presets \
            --hidden-import src.models.media \
            --hidden-import src.utils.sound \
            --hidden-import src.bootstrap \
            --hidden-import webview.platforms.cocoa \
            --hidden-import pydantic_core --hidden-import sqlite3 \
            --noconfirm \
            retrodisc_portable.py

      - name: Info.plist anpassen
        run: |
          PLIST="dist/RetroDisc.app/Contents/Info.plist"
          # Bundle-Identifier und Display-Name setzen
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier de.retrodisc.app" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName RetroDisc" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName RetroDisc" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" "$PLIST" || true
          # Damit macOS weiss es ist eine GUI-App
          /usr/libexec/PlistBuddy -c "Set :LSUIElement false" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" 2>/dev/null || true
          echo "Info.plist:"
          cat "$PLIST"

      - name: DMG erstellen (mit Applications-Link)
        run: |
          # Temp-Ordner fuer DMG-Inhalt
          mkdir -p /tmp/dmg_content
          cp -R dist/RetroDisc.app /tmp/dmg_content/
          ln -s /Applications /tmp/dmg_content/Applications

          # DMG mit hdiutil
          hdiutil create \
            -volname "RetroDisc" \
            -srcfolder /tmp/dmg_content \
            -ov -format UDBZ \
            dist/RetroDisc.dmg

          ls -lh dist/RetroDisc.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: RetroDisc-macOS
          path: dist/RetroDisc.dmg
          retention-days: 90
