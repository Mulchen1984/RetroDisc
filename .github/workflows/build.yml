name: RetroDisc Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Dependencies
        run: pip install pyinstaller pywebview pydantic structlog rich click httpx yt-dlp sounddevice soundfile certifi openai-whisper scenedetect librosa
      - name: FFmpeg laden
        run: python prepare_vendor.py
      - name: EXE bauen
        run: |
          python -m PyInstaller --onefile --windowed --name RetroDisc --icon assets/retrodisc.ico --version-file version_info.txt --manifest retrodisc.manifest --add-data "src/ui/app.html;src/ui" --add-data "src/ui/splash.html;src/ui" --add-data "assets;assets" --add-data "vendor/ffmpeg.exe;vendor" --add-data "vendor/ffprobe.exe;vendor" --collect-data pydantic --collect-data certifi --collect-data yt_dlp --collect-submodules yt_dlp --hidden-import src.core.ffmpeg --hidden-import src.core.pipeline --hidden-import src.core.downloader --hidden-import src.core.disc --hidden-import src.services.converter --hidden-import src.services.search --hidden-import src.services.library --hidden-import src.services.dvd_workflow --hidden-import src.services.smart_edit --hidden-import src.services.subtitle --hidden-import src.services.upscaler --hidden-import src.services.assistant --hidden-import src.services.watch_folder --hidden-import src.config.settings --hidden-import src.config.presets --hidden-import src.models.media --hidden-import src.utils.sound --hidden-import src.bootstrap --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium --hidden-import pydantic_core --hidden-import sqlite3 --noconfirm retrodisc_portable.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RetroDisc-Windows
          path: dist/RetroDisc.exe
          retention-days: 90

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Dependencies
        run: pip install pyinstaller pywebview pydantic structlog rich click httpx yt-dlp sounddevice soundfile certifi openai-whisper scenedetect librosa dmgbuild
      - name: FFmpeg laden
        run: |
          mkdir -p vendor
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o /tmp/ffmpeg.zip --silent --show-error
          cd vendor && unzip -o /tmp/ffmpeg.zip && chmod +x ffmpeg && cd ..
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o /tmp/ffprobe.zip --silent --show-error
          cd vendor && unzip -o /tmp/ffprobe.zip && chmod +x ffprobe && cd ..
      - name: Icon
        run: |
          if [ -f assets/retrodisc.ico ]; then
            mkdir -p /tmp/icon.iconset
            for s in 16 32 128 256 512; do sips -z $s $s assets/retrodisc.ico --out /tmp/icon.iconset/icon_${s}x${s}.png 2>/dev/null || true; done
            iconutil -c icns /tmp/icon.iconset -o assets/retrodisc.icns 2>/dev/null || true
          fi
      - name: App bauen
        run: |
          python3 -m PyInstaller --onefile --windowed --name RetroDisc --icon assets/retrodisc.icns --add-data "src/ui/app.html:src/ui" --add-data "src/ui/splash.html:src/ui" --add-data "assets:assets" --add-data "vendor/ffmpeg:vendor" --add-data "vendor/ffprobe:vendor" --collect-data pydantic --collect-data certifi --collect-data yt_dlp --collect-submodules yt_dlp --hidden-import src.core.ffmpeg --hidden-import src.core.pipeline --hidden-import src.core.downloader --hidden-import src.core.disc --hidden-import src.services.converter --hidden-import src.services.search --hidden-import src.services.library --hidden-import src.services.dvd_workflow --hidden-import src.services.smart_edit --hidden-import src.services.subtitle --hidden-import src.services.upscaler --hidden-import src.services.assistant --hidden-import src.services.watch_folder --hidden-import src.config.settings --hidden-import src.config.presets --hidden-import src.models.media --hidden-import src.utils.sound --hidden-import src.bootstrap --hidden-import webview.platforms.cocoa --hidden-import pydantic_core --hidden-import sqlite3 --noconfirm retrodisc_portable.py
      - name: DMG
        run: python3 create_dmg.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RetroDisc-macOS
          path: dist/RetroDisc.dmg
          retention-days: 90
