name: RetroDisc Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ════════════════════════════════════════
  # Canonical Windows release path: EXE + portable ZIP + installer.
  # ════════════════════════════════════════
  build-windows:
    name: Windows release artifacts
    runs-on: windows-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python 3.11 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywebview certifi

      - name: Source-Gates ausführen
        run: |
          python -m pytest -q
          python -m compileall -q src installer scripts tools build.py retrodisc_launcher.py prepare_vendor.py
          python prepare_vendor.py
          python .hermes/verify_core.py

      - name: Canonical Windows-Build (PR/Branch, unsigniert)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python build.py --clean

      - name: Canonical Windows-Build (Tag, Signierung verpflichtend)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.RETRODISC_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.RETRODISC_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            throw "Tag-Release verweigert: RETRODISC_SIGN_PFX_BASE64 fehlt."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_PASSWORD)) {
            throw "Tag-Release verweigert: RETRODISC_SIGN_PASSWORD fehlt."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "retrodisc-release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
            )
            $env:RETRODISC_SIGN_PFX = $pfxPath
            $env:RETRODISC_SIGN_PASSWORD = $env:SIGN_PFX_PASSWORD
            python build.py --clean --sign
            if ($LASTEXITCODE -ne 0) { throw "Signierter Release-Build fehlgeschlagen." }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Alle drei Artefakte prüfen
        shell: pwsh
        run: |
          $artifacts = @(
            "dist\RetroDisc.exe",
            "Output\RetroDisc_1.0.0_Portable.zip",
            "Output\RetroDisc_Setup_1.0.0.exe"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Fehlendes Release-Artefakt: $artifact"
            }
            if ((Get-Item -LiteralPath $artifact).Length -lt 10MB) {
              throw "Unplausibel kleines Release-Artefakt: $artifact"
            }
          }

      - name: Windows-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RetroDisc-Windows
          path: |
            dist/RetroDisc.exe
            Output/RetroDisc_1.0.0_Portable.zip
            Output/RetroDisc_Setup_1.0.0.exe
          if-no-files-found: error
          retention-days: 90

  # ════════════════════════════════════════
  # Release publication is reachable only after the signed tag build succeeds.
  # ════════════════════════════════════════
  release:
    name: GitHub Release erstellen
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Signierte Windows-Artefakte holen
        uses: actions/download-artifact@v4
        with:
          name: RetroDisc-Windows
          path: release/

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: RetroDisc ${{ github.ref_name }}
          body: |
            ## RetroDisc ${{ github.ref_name }}

            Signierte Windows-Artefakte aus dem kanonischen `build.py`-Pfad:

            - `RetroDisc.exe`
            - `RetroDisc_1.0.0_Portable.zip`
            - `RetroDisc_Setup_1.0.0.exe`

          files: |
            release/dist/RetroDisc.exe
            release/Output/RetroDisc_1.0.0_Portable.zip
            release/Output/RetroDisc_Setup_1.0.0.exe
          draft: false
          prerelease: false
