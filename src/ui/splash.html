<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RetroDisc wird gestartet</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #020716; }
body { font-family: "Courier New", Consolas, monospace; }
.splash { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
.branding { width: 100%; height: 100%; object-fit: contain; display: block; }
.startup-status {
  position: absolute;
  left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(720px, calc(100% - 28px));
  padding: 8px 12px 10px;
  color: #74ff79; background: rgba(1, 10, 15, .90);
  border: 2px solid #42e85c; border-radius: 8px;
  box-shadow: 0 0 12px rgba(30, 255, 105, .35);
  text-shadow: 0 0 5px rgba(60, 255, 110, .75);
}
.status-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: bold; }
.progress-track { height: 7px; margin-top: 7px; border: 1px solid #40e85a; background: #06110d; overflow: hidden; }
#progbar {
  width: 12%; height: 100%;
  background: repeating-linear-gradient(90deg, #46e75b 0 14px, #0c6 14px 17px);
  box-shadow: 0 0 8px #41ff68;
  transition: width .45s ease;
}
</style>
</head>
<body>
<div class="splash">
  <img class="branding" src="../../assets/retrodisc_startup.png" alt="RetroDisc Startbild">
  <div class="startup-status" aria-live="polite">
    <div class="status-row">
      <span id="statusText">RetroDisc wird gestartet...</span>
      <span>RETRO MODE</span>
    </div>
    <div class="progress-track"><div id="progbar"></div></div>
  </div>
</div>
<script>
let startupRequested = false;
function finishStartup() {
  if (startupRequested) return;
  startupRequested = true;
  const bar = document.getElementById('progbar');
  const status = document.getElementById('statusText');
  bar.style.width = '100%';
  status.textContent = 'Bereit — RetroDisc wird geöffnet...';
  window.setTimeout(async () => {
    try {
      if (window.pywebview?.api?.splash_complete) {
        await window.pywebview.api.splash_complete();
      }
    } catch (error) {
      status.textContent = 'Start konnte nicht abgeschlossen werden.';
      console.error(error);
    }
  }, 650);
}
window.addEventListener('pywebviewready', () => window.setTimeout(finishStartup, 1550));
</script>
</body>
</html>
